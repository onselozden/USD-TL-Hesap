name: Derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Logo
        run: |
          python -m pip install --quiet pillow
          python assets/logo.py

      - name: Exe derle
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 /win32icon:assets\logo.ico /resource:assets\logo96.png,logo96.png /r:System.Windows.Forms.dll /r:System.Drawing.dll /out:USD-TL-Hesap.exe src\UsdTlHesap.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path USD-TL-Hesap.exe -DestinationPath USD-TL-Hesap.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: USD-TL-Hesap
          path: USD-TL-Hesap.exe

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.1 --title "USD → TL Fiyat Hesap v1.1" --notes "USD-TL-Hesap.zip dosyasını indir, çıkar, USD-TL-Hesap.exe'yi çalıştır."
          }
          gh release upload v1.1 USD-TL-Hesap.zip --clobber
